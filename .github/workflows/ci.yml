name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history: post update dates come from git
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache fonts and optimized images
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.cache/lxgw
            node_modules/.astro
            public/fonts/lxgw
          key: assets-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'scripts/build-font.mjs') }}-${{ github.sha }}
          restore-keys: |
            assets-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'scripts/build-font.mjs') }}-
      - name: Type check
        run: pnpm check
      - name: Unit tests
        run: pnpm test
      - name: Build (Astro + Pagefind)
        run: pnpm build
      - name: Browser tests
        env:
          PLAYWRIGHT_CHANNEL: chrome
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
