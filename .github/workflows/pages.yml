# Builds the site and publishes it to GitHub Pages.
#
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
# The URL is worked out by configure-pages, so this runs unchanged on any fork or
# template copy: https://<user>.github.io/<repo>/ (base path set automatically),
# https://<user>.github.io/ for a <user>.github.io repo, or your custom domain.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history: post update dates come from git
      - name: Read the Pages URL
        id: pages
        uses: actions/configure-pages@v6
      - name: Cache fonts and optimized images
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.cache/lxgw
            node_modules/.astro
            public/fonts/lxgw
          key: assets-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'scripts/build-font.mjs') }}-${{ github.sha }}
          restore-keys: |
            assets-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'scripts/build-font.mjs') }}-
      - name: Build (Astro + Pagefind) and upload
        uses: withastro/action@v6
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v5
